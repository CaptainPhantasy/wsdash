[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsdash"
version = "0.2.1"
description = "On-demand workspace dashboard from Floyd's Labs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Floyd's Labs"}]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
wsdash = "wsdash.cli:main"
mydash = "wsdash.cli:mydash_main"

[project.urls]
Homepage = "https://floydslabs.com"
Repository = "https://github.com/CaptainPhantasy/wsdash"
Issues = "https://github.com/CaptainPhantasy/wsdash/issues"

[tool.setuptools.packages.find]
include = ["wsdash*"]

[tool.pytest.ini_options]
# Pin pytest-asyncio loop scope when that plugin is installed; tests are stdlib unittest.
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.setuptools.data-files]
"share/wsdash/icons" = ["assets/icons/*"]
